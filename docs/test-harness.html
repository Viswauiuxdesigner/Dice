<!DOCTYPE html>
<html>
<head>
  <title>Cars.co.za Extraction Validation Suite</title>
</head>
<body>
  <h1>Cars.co.za Extraction Test Runner</h1>
  <div id="output" style="white-space:pre; font-family:monospace;"></div>

  <iframe id="frame-ferrari" src="cars-co-za-ferrari-sample.html" style="width:1px; height:1px;"></iframe>
  <iframe id="frame-mazda" src="cars-co-za-sample.html" style="width:1px; height:1px;"></iframe>

  <script src="normalizers.js"></script>
  <script src="validators.js"></script>
  <script src="source-extractor.js"></script>

  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        const fDoc = document.getElementById('frame-ferrari').contentDocument;
        const mDoc = document.getElementById('frame-mazda').contentDocument;

        const fResult = window.CarSourceExtractor.extractFromDocument(fDoc);
        const mResult = window.CarSourceExtractor.extractFromDocument(mDoc);

        const out = {
          ferrari: fResult.normalized,
          mazda: mResult.normalized
        };

        document.getElementById('output').textContent = JSON.stringify(out, null, 2);
        console.log('=== TEST RESULTS ===');
        console.log(JSON.stringify(out, null, 2));
      }, 500);
    });
  </script>
</body>
</html>
